name: .NET CI
on: [push, pull_request]
permissions:
 contents: read
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: 9.0.x }
   - run: dotnet restore tests/CubeSolverPro.Core.Tests/CubeSolverPro.Core.Tests.csproj
   - run: dotnet build tests/CubeSolverPro.Core.Tests/CubeSolverPro.Core.Tests.csproj --no-restore --configuration Release
   - run: dotnet test tests/CubeSolverPro.Core.Tests/CubeSolverPro.Core.Tests.csproj --no-build --configuration Release
 maui:
  strategy:
   matrix: { include: [{os: windows-latest, tfm: net9.0-windows10.0.19041.0}, {os: windows-latest, tfm: net9.0-android}] }
  runs-on: ${{ matrix.os }}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: 9.0.x }
   - run: dotnet workload install maui
   - run: dotnet restore src/CubeSolverPro.App/CubeSolverPro.App.csproj
   - run: dotnet build src/CubeSolverPro.App/CubeSolverPro.App.csproj -f ${{ matrix.tfm }} --no-restore --configuration Release
