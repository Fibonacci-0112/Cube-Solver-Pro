# Windows packaging.
#
# Two targets are produced:
#   nsis — a normal .exe installer for direct download
#   appx — the MSIX package the Microsoft Store accepts
#
# The Store will only accept a package whose identity matches the listing you
# reserved in Partner Center, so the three values under `appx` below must be
# replaced with your own before submitting. Everything else works as-is.

# The electron version in package.json is pinned exactly rather than to a
# range, and has to stay that way. npm hoists electron to the workspace root,
# so electron-builder cannot find it under apps/windows and falls back to
# reading the version out of package.json — which it accepts only when it is
# exact. A caret there fails the Windows build with "Cannot compute electron
# version from installed node modules".

appId: com.fibonacci0112.cubesolverpro
productName: Cube Solver Pro

directories:
  output: dist-release
  buildResources: build

# The renderer is already bundled into dist/ by Vite and the main process is
# bundled by esbuild, so no node_modules need to ship.
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!node_modules/**/*'

win:
  target:
    - nsis
    - appx
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

appx:
  # --- Replace these three with the values from Partner Center ---------------
  # Partner Center → your app → Product management → Product identity.
  # `identityName` is "Package/Identity/Name", `publisher` is
  # "Package/Identity/Publisher", and `publisherDisplayName` is
  # "Package/Properties/PublisherDisplayName".
  identityName: 00000Publisher.CubeSolverPro
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisherDisplayName: Publisher display name
  # ---------------------------------------------------------------------------
  applicationId: CubeSolverPro
  displayName: Cube Solver Pro
  backgroundColor: '#1a1a19'
  languages:
    - en-GB
    - en-US
